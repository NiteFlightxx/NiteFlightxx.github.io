<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
  <title id="title">单位圆上目标函数的约束极值</title>
  <desc id="desc">右上方的最大值候选处，目标等值线与单位圆相切，目标梯度与约束梯度平行。左下方的点是最小值候选。</desc>
  <defs>
    <marker id="normal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b3c38e"/></marker>
    <marker id="objective" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9abeb4"/></marker>
  </defs>
  <rect width="560" height="440" rx="12" fill="#202720"/>
  <g font-family="sans-serif" font-size="19" fill="#e8eadd">
    <text x="280" y="34" text-anchor="middle">单位圆上的目标极值</text>
    <path d="M110 230H458M280 365V70" stroke="#cbd1c0" opacity=".35" fill="none"/>
    <text x="466" y="237">x</text><text x="288" y="80">y</text>
    <circle cx="280" cy="230" r="120" fill="none" stroke="#cbd1c0" stroke-width="2"/>
    <path d="M283 63L449 229" stroke="#9abeb4" stroke-width="2"/>
    <text x="100" y="99" fill="#9abeb4">目标等值线</text>
    <path d="M225 105L304 87" stroke="#9abeb4" fill="none"/>
    <line x1="364.85" y1="145.15" x2="443" y2="67" stroke="#b3c38e" stroke-width="3" marker-end="url(#normal)"/>
    <line x1="364.85" y1="145.15" x2="410" y2="100" stroke="#9abeb4" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#objective)"/>
    <circle cx="364.85" cy="145.15" r="6" fill="#b3c38e"/>
    <text x="370" y="177">最大值候选</text>
    <circle cx="195.15" cy="314.85" r="6" fill="#b3c38e"/>
    <text x="69" y="351">最小值候选</text>
    <path d="M187 337L195 323" stroke="#cbd1c0"/>
    <line x1="62" y1="391" x2="104" y2="391" stroke="#b3c38e" stroke-width="3"/>
    <text x="114" y="397">约束梯度</text>
    <line x1="292" y1="391" x2="334" y2="391" stroke="#9abeb4" stroke-width="3" stroke-dasharray="5 5"/>
    <text x="344" y="397">目标梯度</text>
  </g>
</svg>
